name: ci
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        compiler:
          - ghc94
          - ghc96
          - ghc98
          - ghc910
          - ghc912
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        name: Checkout
      - uses: cachix/install-nix-action@v31
        name: Install Nix
        with:
          nix_path: nixpkgs=./nix/pkgs.nix
      - uses: cachix/cachix-action@v16
        name: Set up Cachix
        with:
          name: awakesecurity
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix-build
        name: nix-build --argstr compiler "${{ matrix.compiler }}"
